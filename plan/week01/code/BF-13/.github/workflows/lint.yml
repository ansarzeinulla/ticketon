name: Lint

# Formatting only, so a style slip is reported within seconds of a push.

on:
  pull_request:

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l api)" || (gofmt -l api; exit 1)
